services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: personal_blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports:
      - "5432:5432"
    volumes:
      - blog-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d personal_blog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  blog-postgres:
