spring:
  application:
    name: personal-blog-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/personal_blog}
    username: ${DATABASE_USERNAME:blog}
    password: ${DATABASE_PASSWORD:blog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      cookie:
        name: BLOG_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
blog:
  cors:
    allowed-origins: ${BLOG_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    api-key: ${BLOG_ADMIN_API_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
