spring:
  application:
    name: personal-blog-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/personal_blog}
    username: ${DATABASE_USERNAME:blog}
    password: ${DATABASE_PASSWORD:blog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      # Keep parser limits slightly above the product limit so the API can return
      # its stable IMAGE_TOO_LARGE response for files just over 5 MB.
      max-file-size: 6MB
      max-request-size: 6MB
server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  servlet:
    session:
      cookie:
        name: BLOG_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
blog:
  posts:
    publish-delay-ms: ${BLOG_POST_PUBLISH_DELAY_MS:15000}
  cors:
    allowed-origins: ${BLOG_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    api-key: ${BLOG_ADMIN_API_KEY:}
    email: ${BLOG_ADMIN_EMAIL:}
  frontend-url: ${BLOG_FRONTEND_URL:http://localhost:5173}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${BLOG_EMAIL_FROM:onboarding@resend.dev}
  newsletter:
    dispatch-delay-ms: ${BLOG_NEWSLETTER_DISPATCH_DELAY_MS:15000}
  media:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
